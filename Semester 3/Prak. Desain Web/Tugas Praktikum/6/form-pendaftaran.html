<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Pendaftaran</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Formulir Pendaftaran Mahasiswa Baru</h1>
        <form>
            <label for="txtNama">Nama Lengkap</label>
            <input type="text" id="txtNama" name="txtNama" size="50" placeholder="Nama Lengkap..." required>

            <label for="txtEmail">Email</label>
            <input type="email" id="txtEmail" name="txtEmail" size="50" placeholder="Masukkan E-mail..." required>

            <label for="txtPassword">Password</label>
            <input type="password" id="txtPassword" name="txtPassword" size="50" placeholder="Kata Sandi..." required>

            <label for="tanggalLahir">Tanggal Lahir</label>
            <input type="date" id="tanggalLahir" name="tanggalLahir">

            <label for="gender">Jenis Kelamin</label>
            <div class="gender-group">
                <label><input type="radio" name="gender" value="Laki-Laki"> Laki-Laki</label>
                <label><input type="radio" name="gender" value="Perempuan"> Perempuan</label>
            </div>

            <label for="jadwalKelas">Jadwal Kelas</label>
            <select id="jadwalKelas" name="jadwalKelas" required>
                <option value="">== Pilih Kelas ==</option>
                <option value="Pagi" selected>Pagi</option>
                <option value="Siang">Siang</option>
                <option value="Malam">Malam</option>
            </select>

            <label for="txtPesan">Pesan</label>
            <textarea id="txtPesan" name="txtPesan" cols="40" rows="4" placeholder="What's Cooking?" required></textarea>

            <div class="buttons">
                <input type="submit" value="Daftar">
            </div>
        </form>
    </div>
</body>
</html>
